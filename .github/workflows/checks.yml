# Nothing ran the tests or the linters on push before this: the only workflow was
# the Pages deploy. Formatter drift accumulated across nine files precisely
# because `ruff format` and `prettier` were never checked anywhere.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The `differential` extra (gym-backgammon) is deliberately not installed —
      # that test skips itself without it, and it exists to be run deliberately
      # rather than to gate every push.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx oxlint
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
