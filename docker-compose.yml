services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # bind-mounted source lives on the host side of a VM boundary (colima/Docker
      # Desktop) where inotify events don't propagate -- WatchFiles must poll instead.
      - WATCHFILES_FORCE_POLLING=true

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://api:8000
      - VITE_USE_POLLING=true
    depends_on:
      - api
